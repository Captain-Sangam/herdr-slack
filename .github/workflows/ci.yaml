name: ci

# One run for each push to a pull request: not a second one for the push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Prettier comes from package-lock.json (npm ci in the script). shfmt is
  # downloaded and checked against its SHA-256. Both run on Linux.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: scripts/format.sh --check
        timeout-minutes: 2

  # The unit tests need no packages. herdr-app check needs Herdr.app on a
  # Mac with a window, so it runs locally only (docs/testing.md).
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
        timeout-minutes: 1
