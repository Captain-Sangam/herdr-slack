# Slack app for the Herdr Slack panel: a user token, no bot user. Read scopes,
# chat:write for replies that you send from the panel's composer (ADR 0011), and the
# *:write scopes that conversations.mark needs to mark read in Slack (ADR 0015).
# api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: Herdr Slack helper
  description: DMs and mentions in a personal Herdr.app panel, with replies.
oauth_config:
  scopes:
    user:
      - search:read
      - users:read
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - files:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - channels:write
      - groups:write
      - im:write
      - mpim:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
